<!DOCTYPE html>
<html lang="fr">

    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <!-- Premier module : identité -->

            <h1 class="identite">
                <span class="nom">Nom</span>
                <span class="separateur"> - </span>

        <!-- Deuxième module : langages principaux -->

            <!-- Logos positionnés par rapport au module -->
            <img class="logo-python" src="image/python-logo-only.svg" alt="Python">
            <img class="logo-cpp" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/ISO_C%2B%2B_Logo.svg" alt="C++">

    </main>
