<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mon jeu</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }

        #toolbar {
            height: 3vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            padding: 5px 10px;
        }

        #fullscreen {
            padding: 5px 12px;
            cursor: pointer;
        }

        #canvas {
            width: 100%;
            height: 97vh;
            display: block;
        }
    </style>
</head>

<body>

    <div id="toolbar">
        <button id="fullscreen">Fullscreen</button>
    </div>

    <canvas id="canvas"
            oncontextmenu="event.preventDefault()">
    </canvas>

    <script>
        document.getElementById("fullscreen").addEventListener("click", () => {
            const canvas = document.getElementById("canvas");

            if (!document.fullscreenElement) {
                canvas.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
    </script>

    <script async type="text/javascript" src="projt1.js"></script>

</body>
</html>
